
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRO 3D MODEL MAKER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial}
header{height:65px;background:#151f35;display:flex;align-items:center;
justify-content:space-between;padding:0 18px;border-bottom:1px solid #334155}
header h2{color:#38bdf8;font-size:20px}
button,select,input{background:#25334d;color:white;border:1px solid #475569;
padding:9px;border-radius:7px;cursor:pointer}
button:hover{background:#087da9}
.app{display:grid;grid-template-columns:190px 1fr 220px;height:calc(100vh - 65px)}
.panel{background:#151f35;padding:12px;overflow:auto}
.panel h3{color:#38bdf8;font-size:15px}
.tool{width:100%;margin:4px 0;text-align:left}
.viewport{position:relative;min-width:0}
canvas{width:100%;height:100%;display:block}
#status{position:absolute;bottom:12px;left:12px;background:#151f35;
padding:9px;border-radius:7px;font-size:12px}
label{display:block;font-size:12px;color:#cbd5e1;margin-top:12px}
input[type=color]{width:100%;height:38px;padding:3px}
input[type=range]{width:100%}
select{width:100%;margin-top:5px}
hr{border-color:#334155}
@media(max-width:750px){
.app{grid-template-columns:105px 1fr;height:calc(100vh - 65px)}
.right{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr}
.panel{padding:7px}
.tool{font-size:11px;padding:7px}
header h2{font-size:15px}
}
</style>
</head>
<body>

<header>
<h2>🚀 PRO 3D MAKER</h2>
<div>
<button onclick="undo()">↶ Undo</button>
<button onclick="resetScene()">Reset</button>
</div>
</header>

<div class="app">

<aside class="panel">
<h3>ADD OBJECT</h3>
<button class="tool" onclick="add('box')">＋ Cube</button>
<button class="tool" onclick="add('sphere')">＋ Sphere</button>
<button class="tool" onclick="add('cylinder')">＋ Cylinder</button>
<button class="tool" onclick="add('cone')">＋ Cone</button>
<button class="tool" onclick="add('torus')">＋ Ring</button>
<button class="tool" onclick="add('car')">＋ Car</button>
<button class="tool" onclick="add('house')">＋ House</button>
<button class="tool" onclick="add('robot')">＋ Robot</button>
<button class="tool" onclick="add('tree')">＋ Tree</button>
<button class="tool" onclick="add('blaster')">＋ Sci-Fi Prop</button>

<hr>
<h3>TOOLS</h3>
<button class="tool" onclick="setMode('translate')">↔ Move</button>
<button class="tool" onclick="setMode('rotate')">⟳ Rotate</button>
<button class="tool" onclick="setMode('scale')">⤢ Scale</button>
<button class="tool" onclick="duplicate()">▣ Duplicate</button>
<button class="tool" onclick="deleteObject()">🗑 Delete</button>

<hr>
<button class="tool" onclick="toggleGrid()">Grid ON/OFF</button>
<button class="tool" onclick="toggleWire()">Wireframe</button>
<button class="tool" onclick="exportGLB()">⬇ Export GLB</button>
</aside>

<main class="viewport">
<canvas id="view"></canvas>
<div id="status">Object Select | Drag to orbit | Scroll to zoom</div>
</main>

<aside class="panel right">
<div>
<h3>OBJECT SETTINGS</h3>
<label>Select Object</label>
<select id="objects" onchange="selectById(this.value)">
<option value="">No Object</option>
</select>

<label>Object Color</label>
<input type="color" id="color" value="#38bdf8" oninput="changeColor(this.value)">

<label>Size</label>
<input type="range" min=".2" max="4" step=".1" value="1"
oninput="changeScale(this.value)">
<label>Position X</label>
<input type="range" min="-5" max="5" step=".1" value="0"
oninput="changePosition('x',this.value)">
<label>Position Y</label>
<input type="range" min="-5" max="5" step=".1" value="0"
oninput="changePosition('y',this.value)">
<label>Position Z</label>
<input type="range" min="-5" max="5" step=".1" value="0"
oninput="changePosition('z',this.value)">

<label>Rotation Y</label>
<input type="range" min="0" max="360" value="0"
oninput="changeRotation(this.value)">

<hr>
<h3>CAMERA</h3>
<button class="tool" onclick="resetCamera()">Reset Camera</button>
<button class="tool" onclick="saveProject()">💾 Save Project</button>
<button class="tool" onclick="loadProject()">📂 Load Project</button>
<input type="file" id="projectFile" accept=".json" hidden
onchange="readProject(event)">
</div>
</aside>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {TransformControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/TransformControls.js';
import {GLTFExporter} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';

const canvas=document.querySelector('#view');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#0b1020');

const camera=new THREE.PerspectiveCamera(50,1,.1,1000);
camera.position.set(8,7,10);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,10,5);
scene.add(light);

const grid=new THREE.GridHelper(30,30,0x38bdf8,0x334155);
scene.add(grid);

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;

const transform=new TransformControls(camera,renderer.domElement);
scene.add(transform.getHelper());

transform.addEventListener('dragging-changed',e=>{
orbit.enabled=!e.value;
});
transform.addEventListener('objectChange',()=>{
if(selected)updateInputs();
});

const world=new THREE.Group();
scene.add(world);

let selected=null;
let nextId=1;
let history=[];
let wire=false;

function resize(){
const w=canvas.clientWidth,h=canvas.clientHeight;
camera.aspect=w/h;
camera.updateProjectionMatrix();
renderer.setSize(w,h,false);
}
new ResizeObserver(resize).observe(canvas);
resize();

function mat(color='#38bdf8'){
return new THREE.MeshStandardMaterial({
color,metalness:.35,roughness:.4
});
}

function mesh(geometry,color){
return new THREE.Mesh(geometry,mat(color));
}

function part(parent,geometry,x,y,z,color){
const m=mesh(geometry,color);
m.position.set(x,y,z);
parent.add(m);
return m;
}

function createObject(type){
const g=new THREE.Group();
const c='#38bdf8';
const dark='#334155';

if(type==='box')
part(g,new THREE.BoxGeometry(1,1,1),0,0,0,c);

if(type==='sphere')
part(g,new THREE.SphereGeometry(.6,32,24),0,0,0,c);

if(type==='cylinder')
part(g,new THREE.CylinderGeometry(.5,.5,1,32),0,0,0,c);

if(type==='cone')
part(g,new THREE.ConeGeometry(.6,1.2,32),0,0,0,c);

if(type==='torus')
part(g,new THREE.TorusGeometry(.5,.15,16,48),0,0,0,c);

if(type==='car'){
part(g,new THREE.BoxGeometry(2.3,.5,1.1),0,.35,0,c);
part(g,new THREE.BoxGeometry(1.1,.55,.9),-.1,.85,0,'#7dd3fc');
for(let x of [-.7,.7]){
for(let z of [-.6,.6]){
const w=part(g,new THREE.CylinderGeometry(.27,.27,.18,24),
x,0,z,dark);
w.rotation.x=Math.PI/2;
}}
}

if(type==='house'){
part(g,new THREE.BoxGeometry(1.6,1.4,1.6),0,.7,0,c);
const roof=part(g,new THREE.ConeGeometry(1.25,.9,4),
0,1.85,0,'#f97316');
roof.rotation.y=Math.PI/4;
part(g,new THREE.BoxGeometry(.35,.7,.08),0,.35,.84,dark);
}

if(type==='robot'){
part(g,new THREE.BoxGeometry(.9,1.1,.6),0,.7,0,c);
part(g,new THREE.SphereGeometry(.4,24,20),0,1.55,0,'#94a3b8');
part(g,new THREE.SphereGeometry(.09,16,16),-.15,1.6,.34,'#22d3ee');
part(g,new THREE.SphereGeometry(.09,16,16),.15,1.6,.34,'#22d3ee');
for(let x of [-.65,.65]){
part(g,new THREE.BoxGeometry(.25,.8,.3),x,.7,0,dark);
}
for(let x of [-.23,.23]){
part(g,new THREE.BoxGeometry(.25,.65,.3),x,-.15,0,dark);
}
}

if(type==='tree'){
part(g,new THREE.CylinderGeometry(.15,.2,1,12),0,.5,0,'#92400e');
for(let y of [1,1.7,2.3]){
part(g,new THREE.ConeGeometry(.8,.95,8),0,y,0,'#22c55e');
}
}

// Fictional decorative energy blaster prop
if(type==='blaster'){
part(g,new THREE.BoxGeometry(1.8,.35,.4),0,.15,0,c);
part(g,new THREE.BoxGeometry(.45,.65,.35),-.25,-.35,0,dark);
part(g,new THREE.BoxGeometry(.45,.2,.5),.65,.4,0,'#f59e0b');
part(g,new THREE.SphereGeometry(.2,20,16),.15,.2,.23,'#22d3ee');
part(g,new THREE.BoxGeometry(.5,.08,.5),-.1,.4,0,dark);
}

g.userData.id=nextId++;
g.userData.type=type;
g.name=type+' '+g.userData.id;
return g;
}

function add(type){
saveHistory();
const obj=createObject(type);
world.add(obj);
select(obj);
refreshList();
}

function select(obj){
selected=obj;
transform.detach();
if(obj)transform.attach(obj);
refreshList();
updateInputs();
}

function refreshList(){
const s=document.querySelector('#objects');
s.innerHTML='<option value="">No Object</option>';
world.children.forEach(o=>{
const op=document.createElement('option');
op.value=o.userData.id;
op.textContent=o.name;
s.appendChild(op);
});
if(selected)s.value=selected.userData.id;
}

window.selectById=id=>{
select(world.children.find(o=>String(o.userData.id)===id)||null);
};

window.setMode=mode=>{
if(!selected)return alert('पहले Object Select करें');
transform.setMode(mode);
};

window.changeColor=value=>{
if(!selected)return;
selected.traverse(o=>{
if(o.isMesh){
o.material.color.set(value);
}
});
};

window.changeScale=value=>{
if(selected)selected.scale.setScalar(Number(value));
};

window.changePosition=(axis,value)=>{
if(selected)selected.position[axis]=Number(value);
};

window.changeRotation=value=>{
if(selected)selected.rotation.y=THREE.MathUtils.degToRad(Number(value));
};

function updateInputs(){
if(!selected)return;
document.querySelector('#color').value='#38bdf8';
document.querySelectorAll('input[type=range]').forEach((el,i)=>{
if(i===0)el.value=selected.scale.x;
if(i===1)el.value=selected.position.x;
if(i===2)el.value=selected.position.y;
if(i===3)el.value=selected.position.z;
if(i===4)el.value=THREE.MathUtils.radToDeg(selected.rotation.y);
});
}

window.deleteObject=()=>{
if(!selected)return;
saveHistory();
world.remove(selected);
select(null);
refreshList();
};

window.duplicate=()=>{
if(!selected)return;
saveHistory();
const copy=selected.clone(true);
copy.userData={...selected.userData,id:nextId++};
copy.name=selected.name+' Copy';
copy.position.x+=1;
world.add(copy);
select(copy);
};

function saveHistory(){
history.push(world.children.map(o=>({
type:o.userData.type,
id:o.userData.id,
position:o.position.toArray(),
rotation:o.rotation.toArray(),
scale:o.scale.toArray(),
color:o.children[0]?.material?.color?.getHexString()
})));
if(history.length>30)history.shift();
}

window.undo=()=>{
const old=history.pop();
if(!old)return;
world.clear();
transform.detach();
selected=null;
old.forEach(data=>{
const o=createObject(data.type);
o.userData.id=data.id;
o.position.fromArray(data.position);
o.rotation.fromArray(data.rotation);
o.scale.fromArray(data.scale);
if(data.color)o.traverse(p=>{
if(p.isMesh)p.material.color.set('#'+data.color);
});
world.add(o);
});
nextId=Math.max(1,...old.map(x=>x.id))+1;
refreshList();
};

window.toggleGrid=()=>grid.visible=!grid.visible;
window.toggleWire=()=>{
wire=!wire;
world.traverse(o=>{
if(o.isMesh)o.material.wireframe=wire;
});
};
window.resetCamera=()=>{
camera.position.set(8,7,10);
orbit.target.set(0,0,0);
};
window.resetScene=()=>{
if(!confirm('सभी Objects हटाएं?'))return;
world.clear();
select(null);
refreshList();
};

window.saveProject=()=>{
const data=world.children.map(o=>({
type:o.userData.type,id:o.userData.id,
position:o.position.toArray(),
rotation:o.rotation.toArray(),
scale:o.scale.toArray(),
color:o.children[0]?.material?.color?.getHexString()
}));
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
download(blob,'my-3d-project.json');
};

window.loadProject=()=>document.querySelector('#projectFile').click();

window.readProject=e=>{
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const data=JSON.parse(reader.result);
world.clear();select(null);
data.forEach(d=>{
const o=createObject(d.type);
o.userData.id=d.id;
o.position.fromArray(d.position);
o.rotation.fromArray(d.rotation);
o.scale.fromArray(d.scale);
if(d.color)o.traverse(p=>{
if(p.isMesh)p.material.color.set('#'+d.color);
});
world.add(o);
});
nextId=Math.max(1,...data.map(d=>d.id))+1;
refreshList();
}catch(err){alert('Invalid project file');}
};
reader.readAsText(file);
};

function download(blob,name){
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=name;a.click();
URL.revokeObjectURL(url);
}

window.exportGLB=()=>{
new GLTFExporter().parse(world,result=>{
const blob=result instanceof ArrayBuffer?
new Blob([result],{type:'model/gltf-binary'}):
new Blob([JSON.stringify(result)],{type:'application/json'});
download(blob,result instanceof ArrayBuffer?'model.glb':'model.gltf');
},{binary:true});
};

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

canvas.addEventListener('pointerdown',e=>{
if(transform.dragging)return;
const rect=canvas.getBoundingClientRect();
pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
raycaster.setFromCamera(pointer,camera);
const hits=raycaster.intersectObjects(world.children,true);
if(hits.length){
let obj=hits[0].object;
while(obj.parent!==world && obj.parent)obj=obj.parent;
if(obj.parent===world)select(obj);
}else if(!transform.dragging)select(null);
});

function animate(){
requestAnimationFrame(animate);
orbit.update();
renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Studio</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;text-align:center;
 background:#17243a;border-bottom:1px solid #334155;
}
header h1{margin:0;color:#38bdf8}
header p{color:#cbd5e1}
.container{padding:20px;max-width:1200px;margin:auto}
.toolbar{
 display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;
}
button,select,input{
 padding:11px;border:1px solid #475569;
 border-radius:8px;background:#1e293b;color:white;
 cursor:pointer;
}
button:hover{background:#0284c7}
.main{
 display:grid;grid-template-columns:230px 1fr;gap:15px;
}
.sidebar,.viewer{
 background:#1e293b;border-radius:14px;padding:15px;
}
.sidebar button{width:100%;margin:5px 0;text-align:left}
#scene{
 width:100%;height:520px;display:block;
 border-radius:10px;background:#0b1220;
}
.viewer h2{margin-top:0}
.info{color:#94a3b8;font-size:13px}
@media(max-width:700px){
 .main{grid-template-columns:1fr}
 #scene{height:400px}
}
</style>
</head>

<body>

<header>
<h1>🚀 3D MODEL STUDIO</h1>
<p>Design • Explore • Rotate • Customize</p>
</header>

<div class="container">

<div class="toolbar">
<button onclick="resetView()">⟳ Reset View</button>
<button onclick="rotateToggle()">▶ Auto Rotate</button>
<button onclick="zoomIn()">＋ Zoom</button>
<button onclick="zoomOut()">－ Zoom</button>
<select id="color" onchange="changeColor(this.value)">
<option value="#38bdf8">Blue</option>
<option value="#ef4444">Red</option>
<option value="#22c55e">Green</option>
<option value="#facc15">Yellow</option>
<option value="#a855f7">Purple</option>
<option value="#e2e8f0">White</option>
</select>
</div>

<div class="main">

<div class="sidebar">
<h3>3D Models</h3>
<div id="models"></div>
<p class="info">एक मॉडल चुनें और 3D में देखें।</p>
</div>

<div class="viewer">
<h2 id="modelName">3D Model Viewer</h2>
<canvas id="scene"></canvas>
<p class="info">
Mouse से Drag करके Rotate करें। Scroll से Zoom करें।
मोबाइल पर उंगली से Drag करें।
</p>
</div>

</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1220);

const camera=new THREE.PerspectiveCamera(
45,canvas.clientWidth/canvas.clientHeight,0.1,1000
);
camera.position.set(5,4,7);

const renderer=new THREE.WebGLRenderer({
canvas,antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2));

const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,10,7);
scene.add(light);

const grid=new THREE.GridHelper(20,20,0x334155,0x1e293b);
scene.add(grid);

const group=new THREE.Group();
scene.add(group);

let currentColor=0x38bdf8;
let autoRotate=false;
let dragging=false,lastX=0,lastY=0;

const material=()=>new THREE.MeshStandardMaterial({
color:currentColor,metalness:.45,roughness:.35
});

function box(x,y,z,w,h,d,mat=material()){
const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
obj.position.set(x,y,z);
group.add(obj);return obj;
}

function sphere(x,y,z,r,mat=material()){
const obj=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat);
obj.position.set(x,y,z);
group.add(obj);return obj;
}

function cylinder(x,y,z,r1,r2,h,mat=material()){
const obj=new THREE.Mesh(
new THREE.CylinderGeometry(r1,r2,h,24),mat);
obj.position.set(x,y,z);
group.add(obj);return obj;
}

function clearModel(){
while(group.children.length){
const o=group.children[0];
group.remove(o);
o.geometry?.dispose();
}
}

function makeModel(type){
clearModel();
const dark=new THREE.MeshStandardMaterial({color:0x334155,metalness:.7});
const glass=new THREE.MeshStandardMaterial({
color:0x38bdf8,metalness:.3,roughness:.15
});

if(type==='Gun'){
// Fictional sci-fi energy blaster game prop
box(0,0,0,2,.35,.45);
box(-.1,-.38,0,.45,.8,.4,dark);
box(.8,.2,0,.5,.18,.3,glass);
box(-.9,.15,0,.4,.5,.5,dark);
sphere(.2,.22,0,.16,glass);
box(0,.4,0,.8,.08,.25,dark);
}

if(type==='Car'){
box(0,.45,0,2.5,.65,1.2);
box(.1,1,0,1.3,.55,1,glass);
for(let x of [-.8,.8]){
for(let z of [-.7,.7]){
const w=cylinder(x,.1,z,.34,.34,.2,dark);
w.rotation.x=Math.PI/2;
}
}
}

if(type==='House'){
box(0,.7,0,2,1.4,2);
const roof=new THREE.Mesh(
new THREE.ConeGeometry(1.65,1,4),material());
roof.position.y=1.9;roof.rotation.y=Math.PI/4;
group.add(roof);
box(0,.4,1.02,.5,.8,.08,dark);
}

if(type==='Robot'){
sphere(0,1.8,0,.48);
box(0,.8,0,1,1.2,.7);
for(let x of [-.7,.7]){
box(x,.8,0,.3,1,.3,dark);
box(x,-.15,0,.3,.8,.3);
}
box(0,2.35,0,.1,.35,.1,dark);
sphere(0,2.55,0,.12,glass);
}

if(type==='Tree'){
cylinder(0,.8,0,.18,.25,1.6,new THREE.MeshStandardMaterial({color:0x854d0e}));
for(let y of [1.4,2,2.6]){
const leaves=new THREE.Mesh(
new THREE.ConeGeometry(1.1,1.5,8),
new THREE.MeshStandardMaterial({color:0x22c55e}));
leaves.position.y=y;
group.add(leaves);
}
}

if(type==='Character'){
sphere(0,2,0,.42);
box(0,1,0,.7,1,.4);
box(-.5,.5,0,.2,.9,.2,dark);
box(.5,.5,0,.2,.9,.2,dark);
box(-.2,-.1,0,.22,.9,.25);
box(.2,-.1,0,.22,.9,.25);
}

if(type==='Shield'){
const s=new THREE.Mesh(
new THREE.CylinderGeometry(.95,.95,.2,6),
material());
s.position.y=1;
s.rotation.x=Math.PI/2;
group.add(s);
}

if(type==='Ball'){
sphere(0,1,0,1);
}

if(type==='Drone'){
box(0,.4,0,.5,.3,.5);
for(let x of [-1,1]){
for(let z of [-1,1]){
box(x*.7,.4,z*.7,.9,.08,.08,dark);
const p=cylinder(x*1.1,.5,z*1.1,.25,.25,.06,glass);
}
}
}

if(type==='Tower'){
box(0,1,0,.8,2,.8);
for(let y of [.3,1,1.7]){
box(0,y,.43,.35,.35,.08,glass);
}
}

group.position.y=-.5;
}

const names=[
'Gun','Car','House','Robot','Tree',
'Character','Shield','Ball','Drone','Tower'
];

const models=document.getElementById('models');

names.forEach(name=>{
const b=document.createElement('button');
b.textContent='🔷 '+name;
b.onclick=()=>{
makeModel(name);
document.getElementById('modelName').textContent='3D '+name;
};
models.appendChild(b);
});

makeModel('Gun');

function resize(){
const w=canvas.clientWidth,h=canvas.clientHeight;
camera.aspect=w/h;
camera.updateProjectionMatrix();
renderer.setSize(w,h,false);
}
window.addEventListener('resize',resize);
resize();

canvas.addEventListener('pointerdown',e=>{
dragging=true;lastX=e.clientX;lastY=e.clientY;
canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointermove',e=>{
if(!dragging)return;
group.rotation.y+=(e.clientX-lastX)*.01;
group.rotation.x+=(e.clientY-lastY)*.01;
lastX=e.clientX;lastY=e.clientY;
});

canvas.addEventListener('wheel',e=>{
camera.position.multiplyScalar(e.deltaY>0?1.1:.9);
e.preventDefault();
},{passive:false});

window.resetView=()=>{
group.rotation.set(0,0,0);
camera.position.set(5,4,7);
};
window.rotateToggle=()=>autoRotate=!autoRotate;
window.zoomIn=()=>camera.position.multiplyScalar(.85);
window.zoomOut=()=>camera.position.multiplyScalar(1.15);

window.changeColor=value=>{
currentColor=new THREE.Color(value);
group.traverse(o=>{
if(o.isMesh && o.material && o.material.color){
o.material.color.set(currentColor);
}
});
};

function animate(){
requestAnimationFrame(animate);
if(autoRotate)group.rotation.y+=.01;
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
